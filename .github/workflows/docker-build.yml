name: Build and Push Docker Image

# Builds ~87 GB image with baked-in models on an 8-core larger runner (300 GB disk).
# Requires GitHub Team plan for larger runner access.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-8core
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            HF_TOKEN=${{ secrets.HF_TOKEN }}
          provenance: false
          sbom: false
          cache-from: |
            type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/ltx-video:latest
          cache-to: |
            type=inline
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ltx-video:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ltx-video:${{ github.sha }}

      - name: Update RunPod template to new SHA tag
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_TEMPLATE_ID: ${{ secrets.RUNPOD_TEMPLATE_ID }}
          NEW_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/ltx-video:${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Updating RunPod template ${RUNPOD_TEMPLATE_ID} -> ${NEW_IMAGE}"

          # RunPod GraphQL saveTemplate mutation. We only change imageName;
          # all other template fields are preserved server-side because
          # saveTemplate accepts partial input keyed on the existing id.
          payload=$(jq -nc \
            --arg id "${RUNPOD_TEMPLATE_ID}" \
            --arg img "${NEW_IMAGE}" \
            '{query: "mutation($input: SaveTemplateInput!) { saveTemplate(input: $input) { id imageName } }",
              variables: {input: {id: $id, imageName: $img}}}')

          response=$(curl -sS -X POST https://api.runpod.io/graphql \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${RUNPOD_API_KEY}" \
            -d "$payload")

          echo "RunPod response: $response"

          if echo "$response" | jq -e '.errors' >/dev/null; then
            echo "RunPod API returned errors; failing the step." >&2
            exit 1
          fi

          returned=$(echo "$response" | jq -r '.data.saveTemplate.imageName')
          if [ "$returned" != "${NEW_IMAGE}" ]; then
            echo "RunPod returned unexpected imageName: '$returned' (wanted '${NEW_IMAGE}')" >&2
            exit 1
          fi
          echo "Template ${RUNPOD_TEMPLATE_ID} now points at ${returned}"
