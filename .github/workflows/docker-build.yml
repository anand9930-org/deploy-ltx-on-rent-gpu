name: Build and Push Docker Image

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.gitignore'
  workflow_dispatch:

# Cancel an in-flight build for the same ref when a new commit lands.
# Per-ref grouping means main and feature branches don't starve each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Blackwell branch — RTX PRO 6000 Blackwell (sm_122) build, NGC 26.04
          # base. Deploy scripts point at <DOCKERHUB_USERNAME>/ltx-video-blackwell:latest.
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ltx-video-blackwell:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ltx-video-blackwell:${{ github.sha }}
          no-cache: true
