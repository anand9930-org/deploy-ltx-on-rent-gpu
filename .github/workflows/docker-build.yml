name: Build and Push Docker Image

# Builds ~87 GB image with baked-in models on an 8-core larger runner (300 GB disk).
# Requires GitHub Team plan for larger runner access.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-8core
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            HF_TOKEN=${{ secrets.HF_TOKEN }}
          provenance: false
          sbom: false
          cache-from: |
            type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/ltx-video:latest
          cache-to: |
            type=inline
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ltx-video:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ltx-video:${{ github.sha }}

      - name: Update RunPod template to new SHA tag
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_TEMPLATE_ID: ${{ secrets.RUNPOD_TEMPLATE_ID }}
          NEW_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/ltx-video:${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Updating RunPod template ${RUNPOD_TEMPLATE_ID} -> ${NEW_IMAGE}"

          # RunPod REST API: PATCH /v1/templates/<id> accepts partial
          # updates. Unlike the legacy GraphQL saveTemplate mutation,
          # which demands every required field (containerDiskInGb,
          # dockerArgs, env, name, volumeInGb) on every call, the REST
          # endpoint merges the given fields server-side. This is the
          # same endpoint runpodctl template update uses internally
          # (source: runpod/runpodctl v2.1.9 internal/api/templates.go,
          # UpdateTemplate -> c.Patch("/templates/"+id, req)).
          payload=$(jq -nc --arg img "${NEW_IMAGE}" '{imageName: $img}')

          http_status=$(curl -sS -o /tmp/rp-resp.json -w '%{http_code}' \
            -X PATCH "https://rest.runpod.io/v1/templates/${RUNPOD_TEMPLATE_ID}" \
            -H "Authorization: Bearer ${RUNPOD_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$payload")

          echo "HTTP status: $http_status"
          echo "Response body:"
          cat /tmp/rp-resp.json || true
          echo

          if [ "$http_status" != "200" ]; then
            echo "RunPod REST API returned non-200 status ($http_status); failing the step." >&2
            exit 1
          fi

          returned=$(jq -r '.imageName // empty' /tmp/rp-resp.json)
          if [ "$returned" != "${NEW_IMAGE}" ]; then
            echo "RunPod returned unexpected imageName: '$returned' (wanted '${NEW_IMAGE}')" >&2
            exit 1
          fi
          echo "Template ${RUNPOD_TEMPLATE_ID} now points at ${returned}"
