name: Build FA3 Wheel

# Builds a FlashAttention 3 wheel out-of-band and publishes it as a GitHub
# Release asset. Decoupled from `docker-build.yml` because the source build
# (~30-60 min, RAM/disk-heavy) is unsuitable for inlining on every Docker
# image rebuild. See `docs/fa3-wheel-process.md` for the full runbook.
#
# Manual-only trigger. Bumping FA3:
#   1. Run this workflow with a new `fa3_ref` (any Dao-AILab/flash-attention
#      commit SHA, tag, or branch).
#   2. Copy the published Release's wheel URL + sha256 into the Dockerfile
#      build args (`FA3_WHEEL_URL`, `FA3_WHEEL_SHA256`).
#   3. Commit and push — `docker-build.yml` will then ingest the new wheel.

on:
  workflow_dispatch:
    inputs:
      fa3_ref:
        description: "Dao-AILab/flash-attention git ref (commit / tag / branch)"
        required: true
        default: "6c73fb506fa84424c3fa04880f85c789b4a498e2"

permissions:
  contents: write  # required to create the Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ubuntu-latest ships with ~14 GB free disk, which is below the FA3
      # source-build working set (~20 GB peak: nvcc temps + ninja artefacts +
      # NGC image extracted). Reclaim ~30 GB by purging caches we never use.
      - name: Reclaim runner disk
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false  # keep — we need Docker to pull the NGC base
          swap-storage: true

      # Build FA3 inside the same NGC base used at runtime so the resulting
      # `.so` links against torch 2.8.0a0+nv25.6 / cu129 / cp312. Building in
      # any other torch image would risk silent ABI corruption when loaded
      # against the runtime base — the Dockerfile's
      # `assert '.nv' in torch.__version__` boot-blocker exists to catch this.
      #
      # Kernel trims drop the build matrix from "every kernel × every dtype"
      # to "forward-only, BF16, hdim128 (LTX's only head dim)". This shrinks
      # nvcc invocations from ~80 to ~10 — minutes-long build rather than
      # 30-60 min, and fits comfortably in 16 GB RAM.
      - name: Build FA3 wheel inside NGC container
        env:
          FA3_REF: ${{ inputs.fa3_ref }}
        run: |
          set -euo pipefail
          mkdir -p "$PWD/wheels"
          docker run --rm \
            -e TORCH_CUDA_ARCH_LIST="9.0" \
            -e MAX_JOBS=4 \
            -e FLASH_ATTENTION_DISABLE_BACKWARD=TRUE \
            -e FLASH_ATTENTION_DISABLE_VARLEN=TRUE \
            -e FLASH_ATTENTION_DISABLE_FP16=TRUE \
            -e FLASH_ATTENTION_DISABLE_HDIM64=TRUE \
            -e FLASH_ATTENTION_DISABLE_HDIM192=TRUE \
            -e FLASH_ATTENTION_DISABLE_HDIM256=TRUE \
            -e FLASH_ATTENTION_DISABLE_SOFTCAP=TRUE \
            -e FA3_REF="$FA3_REF" \
            -v "$PWD/wheels":/out \
            nvcr.io/nvidia/pytorch:25.06-py3 \
            bash -eux -c '
              apt-get update
              apt-get install -y --no-install-recommends git ninja-build
              rm -rf /var/lib/apt/lists/*
              git clone https://github.com/Dao-AILab/flash-attention.git /tmp/fa3
              cd /tmp/fa3 && git checkout "$FA3_REF"
              cd /tmp/fa3/hopper
              python setup.py bdist_wheel -d /out
              python -c "import flash_attn_interface as f; assert hasattr(f, \"flash_attn_func\"); print(\"build-side smoke OK\")"
            '
          ls -lh wheels/

      - name: Compute checksum and tag
        id: meta
        run: |
          set -euo pipefail
          WHEEL=$(ls wheels/*.whl | head -n1)
          test -n "$WHEEL"
          SHA=$(sha256sum "$WHEEL" | awk '{print $1}')
          SHORT=$(echo "${{ inputs.fa3_ref }}" | cut -c1-8)
          TAG="fa3-cu129-nv25.6-${SHORT}"
          NAME=$(basename "$WHEEL")
          echo "wheel_path=$WHEEL"        >> "$GITHUB_OUTPUT"
          echo "wheel_name=$NAME"         >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA"              >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"                 >> "$GITHUB_OUTPUT"
          {
            echo "## FA3 wheel — \`$TAG\`"
            echo
            echo "Built from \`Dao-AILab/flash-attention@${{ inputs.fa3_ref }}\`"
            echo "inside \`nvcr.io/nvidia/pytorch:25.06-py3\` (cu129 / torch 2.8.0a0+nv25.6 / cp312)."
            echo
            echo "**Targets:** sm_90 (Hopper) only • cp312 • Linux x86_64"
            echo "**Kernel trims:** backward / varlen / fp16 / hdim64 / hdim192 / hdim256 / softcap disabled"
            echo
            echo "**Filename:** \`$NAME\`"
            echo "**sha256:** \`$SHA\`"
            echo
            echo "### Dockerfile build args (copy verbatim)"
            echo
            echo '```dockerfile'
            echo "ARG FA3_WHEEL_URL=https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${NAME}"
            echo "ARG FA3_WHEEL_SHA256=${SHA}"
            echo '```'
          } > release_notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: FA3 wheel — ${{ steps.meta.outputs.tag }}
          body_path: release_notes.md
          files: ${{ steps.meta.outputs.wheel_path }}
          fail_on_unmatched_files: true
