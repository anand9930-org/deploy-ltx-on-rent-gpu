[project]
name = "ltx-video-service"
version = "1.0.0"
description = "LTX-2.3 22B text-to-video generation service"
requires-python = ">=3.11"
dependencies = [
    "bentoml>=1.4",
    "supabase>=2.0.0",
    "huggingface-hub>=0.27.0",
    "hf-xet>=0.1.0",
    "transformers>=4.52,<5.0",
    # Single source of truth for runtime config: see src/config.py.
    # python-dotenv loads .env into os.environ at the entrypoints
    # (service.py + src/download_models.py __main__); pydantic-settings
    # provides the typed view that everywhere else consumes via
    # src.config.get_settings(). Library modules never call load_dotenv
    # and never read os.environ directly.
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    # NGC pytorch:25.06-py3 pre-installs anyio 4.8.x. Load-bearing enforcement
    # lives in the Dockerfile as an explicit `uv pip install --upgrade` step
    # with a build-time assertion; this floor is kept as documentation so the
    # requirement survives a resolver replay (e.g. regenerating uv.lock).
    "anyio>=4.9",
    # torchaudio is intentionally NOT listed here. ltx-core declares it as a
    # transitive dep, but: (1) every PyPI torchaudio release declares a
    # strict companion `torch==<exact>` pin which would force uv to replace
    # NGC's NVIDIA-patched torch 2.8.0a0+...nv25.6 with stock PyPI torch,
    # breaking NGC torchvision's ABI (`torchvision::nms` op fails to
    # register); (2) our service is video-only — `audio_guider_params` is
    # None on every request — so the audio_vae code path that touches
    # torchaudio APIs is unreachable. The Dockerfile strips torchaudio from
    # upstream ltx-core's pyproject and installs a pure-Python stub.
    # FlashAttention 3 is installed separately in the Dockerfile from a
    # self-built wheel cached on this repo's GitHub Releases. The wheel
    # MUST be built inside the NGC pytorch:25.06-py3 base image because
    # NGC's torch fork (`2.8.0a0+nv25.6`) lacks the two-arg
    # `c10::cuda::SetDevice(int8_t, bool)` symbol that every stock-PyPI
    # torch-2.8 wheel links — community/PyPI wheels fail to load.
    # Kept out of pyproject because no PyPI wheel works for our base
    # image. Build/cache flow + bump runbook: docs/fa3-wheel-process.md.
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

# Code quality. Run locally with `ruff check` (or `ruff check --fix` to
# auto-apply the simple fixes). Ruff is intentionally NOT a runtime dep — it
# runs in dev/CI only. Install on demand: `uvx ruff check`.
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["LTX-2-ref"]

[tool.ruff.lint]
# F = pyflakes (catches the things `import os` audits care about: unused
# imports, undefined names, unused vars, redefinitions). Add E/W later if
# we ever want stylistic checks; for now we just want correctness signals.
select = ["F"]

[tool.ruff.lint.per-file-ignores]
# Tests redefine fixtures / use `from … import *`-style helpers.
"tests/**" = ["F811"]
